name: Apply RPR white-blue-red theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply white-blue-red theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''/* =========================================================\n   AI-ПОМОЩНИК РПР + DISCORD LIVE NOTIFICATIONS'''
          css = r'''\n/* =========================================================\n   RPR WHITE / BLUE / RED THEME OVERRIDE\n   ========================================================= */\n:root{\n  --bg:#f5f8fc;\n  --bg2:#ffffff;\n  --panel:#ffffff;\n  --panel2:#eef4fa;\n  --line:rgba(20,63,105,.14);\n  --line2:rgba(20,63,105,.10);\n  --text:#122238;\n  --muted:#5f7085;\n  --muted2:#7b8b9f;\n  --red:#c8203f;\n  --red2:#e52f4d;\n  --blue:#164f8a;\n  --blue2:#2b72b8;\n  --white:#fff;\n  --green:#249968;\n  --shadow:0 25px 70px rgba(20,63,105,.13);\n}\nhtml,body{background:#f5f8fc;color:var(--text)}\nbody{background:radial-gradient(circle at 50% -20%,rgba(43,114,184,.12),transparent 38%),radial-gradient(circle at 0% 35%,rgba(200,32,63,.07),transparent 28%),#f5f8fc}\n.header{background:rgba(255,255,255,.90);border-bottom:1px solid rgba(20,63,105,.12)}\n.header.scrolled{box-shadow:0 15px 50px rgba(20,63,105,.12)}\n.brand-logo{background:linear-gradient(145deg,#fff,#eaf2f9);border-color:rgba(20,63,105,.16);box-shadow:inset 0 0 25px rgba(20,63,105,.03),0 8px 30px rgba(20,63,105,.10)}\n.brand-title{color:#142b45}.brand-sub,.kicker,.hero h1 span,.title span,.card-index,.timeline-year,.person-role,.program-num,.charter-tag,.quote small,.emblem p{color:var(--red2)}\n.nav a{color:#52677e}.nav a:hover{color:#164f8a}.nav a:after{background:var(--red2)}\n.menu-btn{background:#fff;color:#164f8a;border-color:rgba(20,63,105,.16)}\n.disclaimer{background:#fff;color:#65778c;border-bottom-color:rgba(20,63,105,.10)}\n.disclaimer strong{color:var(--red2)}\n#loader{background:#fff}.loader-mark{background:linear-gradient(145deg,#fff,#eaf2f9);border-color:rgba(20,63,105,.16);color:#164f8a}.loader-line{background:#dbe6f0}\n.grid-bg{opacity:.55;background-image:linear-gradient(rgba(20,63,105,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(20,63,105,.045) 1px,transparent 1px)}\n.hero-kicker{color:#60738a}.hero-lead,.desc,.card p,.timeline p,.person p,.program p,.charter p,.join p{color:#5f7085}\n.hero-panel{border-color:rgba(20,63,105,.16);background:radial-gradient(circle at center,rgba(43,114,184,.12),transparent 48%),linear-gradient(145deg,#fff,#edf4fa);box-shadow:var(--shadow)}\n.hero-panel:before{border-color:rgba(20,63,105,.10)}\n.orbit{border-color:rgba(20,63,105,.14)}.orbit:after{background:#164f8a;box-shadow:0 0 18px rgba(22,79,138,.35)}\n.emblem-icon{border-color:rgba(20,63,105,.18);background:rgba(255,255,255,.8);box-shadow:0 0 70px rgba(200,32,63,.10)}\n.emblem h2{color:#142b45}.panel-tag{color:#71849a}\n.btn{background:#fff;color:#173452;border-color:#b9cadb}.btn:hover{border-color:#164f8a;box-shadow:0 12px 30px rgba(20,63,105,.10)}\n.btn-primary,.submit{background:linear-gradient(135deg,#164f8a,#2369a8);border-color:#164f8a;color:#fff}.btn-primary:hover{box-shadow:0 14px 35px rgba(22,79,138,.22)}\n.stat-grid{background:rgba(20,63,105,.14);border-color:rgba(20,63,105,.14)}\n.stat{background:#fff}.stat:hover{background:#f0f6fb}.stat-label{color:#71849a}.stat-number{color:#142b45}.stat-number span{color:var(--red2)}\n.card,.person,.program-item,.charter,.table-wrap,.faq-item,.join-card{background:#fff;border-color:rgba(20,63,105,.14);box-shadow:0 12px 35px rgba(20,63,105,.05)}\n.card:hover{border-color:#7da3c8;box-shadow:0 20px 50px rgba(20,63,105,.10)}\n.card-icon,.person-portrait,.program-num{background:#eef5fb;border-color:rgba(20,63,105,.13)}\n.timeline:before{background:rgba(20,63,105,.16)}.timeline-item:before{background:#fff;border-color:var(--red2)}\n.quote{background:linear-gradient(90deg,#edf4fa,transparent);border-left-color:var(--red2)}.quote p{color:#183451}\n.charter-row{border-bottom-color:rgba(20,63,105,.12)}\nth{background:#164f8a;color:#fff}td{color:#5f7085}tr:hover td{background:#f4f8fc}\n.faq-item{background:#fff}.faq-q{color:#173452}.faq-q span:last-child{color:var(--red2)}\n.join{background:radial-gradient(circle at 80% 20%,rgba(200,32,63,.10),transparent 35%),linear-gradient(145deg,#fff,#edf4fa);border-color:#b7ccdf}.join h2{color:#173452}.join h2 span{color:var(--red2)}.join-point{color:#536980}.join-point b{color:var(--red2)}\n.modal{background:rgba(12,31,52,.55)}.modal-box{background:linear-gradient(145deg,#fff,#edf4fa);border-color:#aac1d7;box-shadow:0 40px 120px rgba(20,63,105,.25)}.modal-close{background:#fff;color:#164f8a;border-color:#c3d2e0}.form-control{background:#fff;color:#173452;border-color:#b9cadb}.form-control:focus{border-color:#164f8a;box-shadow:0 0 0 3px rgba(22,79,138,.08)}.form-group label{color:#415a73}\n.footer{background:#102a46;border-top-color:#183e62}.footer-col h4,.footer-brand p,.footer-col a{color:#d9e5f0}.footer-col a:hover{color:#fff}.footer-bottom{border-top-color:rgba(255,255,255,.15);color:#aebfd0}\n.rpr-оформление-lab-inner{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(238,245,251,.96));border-color:rgba(20,63,105,.14)}.rpr-оформление-card{background:#fff;color:#173452;border-color:rgba(20,63,105,.13)}.rpr-оформление-card span{color:#71849a}\n.ai-launcher{background:linear-gradient(145deg,#164f8a,#0d3157);border-color:#2b72b8;box-shadow:0 14px 45px rgba(20,63,105,.25)}.ai-window{background:#fff;border-color:#a9bfd3;box-shadow:0 35px 100px rgba(20,63,105,.22)}.ai-head{background:#164f8a}.ai-messages{background:#f5f8fc}.ai-msg.bot{background:#fff;color:#27445f;border-color:#d1ddea}.ai-input,.ai-note{background:#eef4fa}.ai-input textarea{background:#fff;color:#173452;border-color:#b9cadb}.ai-suggest{background:#fff;color:#52677e;border-color:#c5d3e0}.discord-notice{background:linear-gradient(145deg,#fff,#edf4fa);border-color:#b6cadc}.discord-notice p{color:#5f7085}.discord-dismiss{background:#fff;color:#60738a;border-color:#c5d3e0}\n.back-top{background:#164f8a;border-color:#2b72b8;color:#fff}.toast{background:#fff;color:#173452;border-color:#b6cadc}\n''' 
          if old in s and 'RPR WHITE / BLUE / RED THEME OVERRIDE' not in s:
              s=s.replace(old, css+'\n'+old, 1)
          s=s.replace('setTheme(localStorage.getItem("rpr-оформление") || "midnight");','setTheme(localStorage.getItem("rpr-оформление") || "federal");')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit theme changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Replace modern theme with white blue red RPR theme"
          git push
