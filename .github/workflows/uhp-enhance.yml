name: Enhance site

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enhance index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "/* AUTO_UHP_ENHANCEMENTS */"

          if marker in s:
              raise SystemExit(0)

          css = r'''/* AUTO_UHP_ENHANCEMENTS */
          :root{--accent-white:#fff;--accent-blue:#2563a6;--accent-red:#d7263d}
          body{background:radial-gradient(circle at 50% -15%,rgba(37,99,166,.22),transparent 36%),radial-gradient(circle at 100% 45%,rgba(215,38,61,.12),transparent 30%),#03070d}
          body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(120deg,transparent 0 42%,rgba(255,255,255,.025) 50%,transparent 58%);background-size:260% 260%;animation:uhpLightSweep 12s linear infinite}
          @keyframes uhpLightSweep{0%{background-position:180% 0}100%{background-position:-80% 100%}}
          .header{background:rgba(3,7,13,.88);border-bottom:1px solid rgba(255,255,255,.12)}
          .nav a{transition:color .25s,transform .25s,text-shadow .25s}.nav a:hover{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.35);transform:translateY(-1px)}
          .btn,.card,.stat,.hero-panel{transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease,background .35s ease}
          .card:hover{box-shadow:0 25px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04) inset}
          .btn:hover{box-shadow:0 12px 35px rgba(255,255,255,.06)}
          .uhp-flag-link{position:relative;display:inline-flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid rgba(255,255,255,.12);overflow:hidden;background:rgba(255,255,255,.025)}
          .uhp-flag-link:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.9) 0 33.33%,rgba(44,89,143,.85) 33.33% 66.66%,rgba(210,39,58,.85) 66.66%);transform:translateX(-105%);transition:transform .45s ease;opacity:.18}
          .uhp-flag-link:hover:before{transform:translateX(0)}
          .uhp-flag{width:24px;height:16px;display:grid;grid-template-rows:repeat(3,1fr);border:1px solid rgba(255,255,255,.3);overflow:hidden;flex:none}.uhp-flag i:nth-child(1){background:#fff}.uhp-flag i:nth-child(2){background:#245b99}.uhp-flag i:nth-child(3){background:#d5263e}
          .uhp-area{margin-top:45px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.uhp-empty{position:relative;min-height:230px;padding:30px;border:1px solid rgba(255,255,255,.11);background:linear-gradient(145deg,#0a1a2b,#06101b);overflow:hidden}.uhp-empty:before{content:"";position:absolute;left:-30%;top:-55%;width:160%;height:160%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.045) 50%,transparent 58%);animation:uhpShine 7s linear infinite}@keyframes uhpShine{to{transform:translate(28%,28%)}}
          .uhp-empty>*{position:relative}.uhp-empty h3{font-size:24px}.uhp-empty p{margin-top:10px;color:var(--muted);font-size:13px}.uhp-empty .uhp-icon{font-size:30px;margin-bottom:18px}.uhp-badge{display:inline-block;margin-top:20px;padding:6px 10px;border:1px solid rgba(255,255,255,.13);color:#aebdce;font-size:8px;font-weight:900;letter-spacing:2px}
          @media(max-width:800px){.uhp-area{grid-template-columns:1fr}.uhp-flag-link{padding:7px 9px}}
          '''

          if "</style>" in s:
              s = s.replace("</style>", css + "\n</style>", 1)

          js = r'''<script id="uhp-enhancements">
          (()=>{
            const ready=()=>{
              const nav=document.querySelector('.nav');
              if(nav){
                const items=[...nav.querySelectorAll('a')];
                const hasVote=items.some(a=>/голос/i.test(a.textContent));
                const hasDocs=items.some(a=>/документ/i.test(a.textContent));
                if(!hasVote){const a=document.createElement('a');a.href='#uhp-voting';a.className='uhp-flag-link';a.innerHTML='<span class="uhp-flag"><i></i><i></i><i></i></span><span>ГОЛОСОВАНИЕ</span>';nav.appendChild(a)}
                if(!hasDocs){const a=document.createElement('a');a.href='#uhp-documents';a.textContent='ДОКУМЕНТЫ';nav.appendChild(a)}
              }
              if(!document.getElementById('uhp-voting')){
                const sec=document.createElement('section');sec.id='uhp-voting';sec.className='section';sec.innerHTML='<div class="container"><div class="section-head"><div class="kicker">ГРАЖДАНСКОЕ УЧАСТИЕ</div><h2 class="title">Голосо<span>вание</span></h2><p class="desc">Здесь будут публиковаться активные голосования партии. Данные можно будет загружать через административную панель.</p></div><div class="uhp-area"><div class="uhp-empty"><div class="uhp-icon">◉</div><h3>Голосований пока нет</h3><p>Раздел готов к подключению данных из админ-панели.</p><span class="uhp-badge">ОЖИДАЕТ ПУБЛИКАЦИИ</span></div></div></div>';document.body.appendChild(sec)
              }
              if(!document.getElementById('uhp-documents')){
                const sec=document.createElement('section');sec.id='uhp-documents';sec.className='section';sec.innerHTML='<div class="container"><div class="section-head"><div class="kicker">ОФИЦИАЛЬНЫЕ МАТЕРИАЛЫ</div><h2 class="title">Докумен<span>ты</span></h2><p class="desc">Здесь будут размещаться официальные документы партии. Управление и публикация — через административную панель.</p></div><div class="uhp-area"><div class="uhp-empty"><div class="uhp-icon">▣</div><h3>Документов пока нет</h3><p>Раздел пустой и готов принимать документы из админ-панели.</p><span class="uhp-badge">ОЖИДАЕТ ПУБЛИКАЦИИ</span></div></div></div>';document.body.appendChild(sec)
              }
            };
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
          })();
          </script>
          '''

          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enhance dark theme, voting and documents"
          git push
          rm -f .github/workflows/uhp-enhance.yml
          git add .github/workflows/uhp-enhance.yml
          git commit -m "Remove one-time enhancement workflow" || true
          git push || true
